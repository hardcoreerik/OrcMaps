name: Data Provenance Truth

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test data provenance checker
        run: python -m unittest discover -s tests -p 'test_data_provenance.py' -v
      - name: Test US-state map pack builder
        run: python -m unittest discover -s tests -p 'test_us_state_packs.py' -v
      - name: Check data provenance
        run: python tools/check_data_provenance.py
